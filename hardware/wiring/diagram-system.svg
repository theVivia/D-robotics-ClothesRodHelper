<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" font-family="Consolas, 'Microsoft YaHei', monospace">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8ab4f8"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#e0715a"/>
    </marker>
    <marker id="aw" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5ac8a0"/>
    </marker>
  </defs>
  <style>
    .b{fill:#1b2230;stroke:#3d4a5c;stroke-width:1.5}
    .hub{fill:#1d2a33;stroke:#4a7f9c;stroke-width:2}
    .unit{fill:#241d2b;stroke:#6b5570;stroke-width:1.4}
    .t{fill:#e6edf3;font-size:13px}
    .ts{fill:#93a1b1;font-size:11px}
    .th{fill:#9fd0ea;font-size:16px}
    .l{stroke:#8ab4f8;stroke-width:1.7;fill:none;marker-end:url(#a)}
    .lp{stroke:#e0715a;stroke-width:2;fill:none;marker-end:url(#ar)}
    .lw{stroke:#5ac8a0;stroke-width:1.7;fill:none;marker-end:url(#aw);stroke-dasharray:6 4}
  </style>

  <text x="24" y="34" fill="#e6edf3" font-size="17">衣序 HangFlow · 整机拓扑（1 中枢 + 4 套挂单元 + 手机）</text>
  <text x="24" y="54" class="ts">中枢只做视觉/规划/Web/MQTT；单元自治，中枢掉线单元原地站住（fail-safe）</text>

  <!-- 市电 -->
  <rect x="40" y="90" width="150" height="54" class="b" rx="6"/>
  <text x="56" y="113" class="t">市电 220V</text>
  <text x="56" y="131" class="ts">演示区排插（带开关）</text>

  <rect x="40" y="170" width="150" height="54" class="b" rx="6"/>
  <text x="56" y="193" class="t">5V/5A 适配器</text>
  <text x="56" y="211" class="ts">=25W，必须 5A 线</text>
  <path d="M115,144 L115,170" class="lp"/>

  <!-- 中枢 -->
  <rect x="290" y="100" width="300" height="250" class="hub" rx="10"/>
  <text x="312" y="128" class="th">RDK X5（4GB）</text>
  <text x="312" y="150" class="ts">Sunrise 5 / 8×A55@1.5GHz / BPU 10 TOPS</text>
  <text x="312" y="168" class="ts">4GB LPDDR4 / Ubuntu 22.04 / ROS2·TROS</text>

  <rect x="312" y="186" width="256" height="34" class="b" rx="4"/>
  <text x="322" y="208" class="t">视觉：ArUco 基准 + 衣物体积</text>

  <rect x="312" y="230" width="256" height="34" class="b" rx="4"/>
  <text x="322" y="252" class="t">间距规划器 / 状态机</text>

  <rect x="312" y="274" width="256" height="34" class="b" rx="4"/>
  <text x="322" y="296" class="t">FastAPI :8000 + mosquitto :1883</text>

  <text x="312" y="334" class="ts">USB3 ×4（每口 1A@5V）· 千兆网 · Wi-Fi6 · CAN FD · 40PIN</text>

  <path d="M190,197 L240,197 L240,140 L290,140" class="lp"/>
  <text x="196" y="188" class="ts" fill="#ffd7a8">5V/5A</text>

  <!-- 相机 -->
  <rect x="660" y="110" width="180" height="54" class="b" rx="6"/>
  <text x="676" y="133" class="t">USB UVC 相机</text>
  <text x="676" y="151" class="ts">1080p30 / 广角 100—120°</text>
  <path d="M590,140 L660,137" class="l"/>
  <text x="596" y="130" class="ts">USB3.0</text>

  <!-- 手机 -->
  <rect x="660" y="200" width="180" height="54" class="b" rx="6"/>
  <text x="676" y="223" class="t">手机网页</text>
  <text x="676" y="241" class="ts">扫码即用，不装 App</text>
  <path d="M590,227 L660,227" class="lw"/>
  <text x="596" y="218" class="ts" fill="#5ac8a0">2.4G Wi-Fi</text>

  <!-- 热点说明 -->
  <rect x="660" y="276" width="340" height="74" fill="#242a1f" stroke="#5a6b45" rx="6"/>
  <text x="674" y="297" class="ts" fill="#c8e6a0">热点：SSID HangFlow / ch 1·6·11 三选一 / 强制 HT20</text>
  <text x="674" y="316" class="ts" fill="#c8e6a0">单元静态 IP 10.42.0.11—.14 · MQTT keepalive 15s + LWT</text>
  <text x="674" y="335" class="ts" fill="#ffb4a2">ESP32-C3 只支持 2.4G，热点必须开 2.4G</text>

  <!-- 单元区 -->
  <rect x="40" y="390" width="960" height="240" class="b" rx="10" stroke-dasharray="7 5" fill="#141a24"/>
  <text x="60" y="416" class="th">ClipUnit ×4（每单元 1 块 18650，各自自治，互不供电）</text>

  <rect x="60" y="434" width="210" height="96" class="unit" rx="7"/>
  <text x="74" y="456" class="t">单元 #1  ESP32-C3</text>
  <text x="74" y="475" class="ts">AS5600 闭环 + VL53L1X 邻距</text>
  <text x="74" y="493" class="ts">DRV8833 → N20 6V → 摩擦轮</text>
  <text x="74" y="511" class="ts">18650 2000mAh / 6V 升压</text>
  <text x="74" y="526" class="ts" fill="#c8e6a0">急停：MQTT / 按键3s / 断电</text>

  <rect x="290" y="434" width="210" height="96" class="unit" rx="7"/>
  <text x="304" y="456" class="t">单元 #2</text>
  <text x="304" y="475" class="ts">10.42.0.12</text>
  <text x="304" y="493" class="ts">堵转 1.5s 自停</text>
  <text x="304" y="511" class="ts">心跳 10s 丢失 → 停机</text>

  <rect x="520" y="434" width="210" height="96" class="unit" rx="7"/>
  <text x="534" y="456" class="t">单元 #3</text>
  <text x="534" y="475" class="ts">10.42.0.13</text>
  <text x="534" y="493" class="ts">低压 3.4V 拒绝起步</text>
  <text x="534" y="511" class="ts">LED：绿/蓝/黄/红闪</text>

  <rect x="750" y="434" width="210" height="96" class="unit" rx="7"/>
  <text x="764" y="456" class="t">单元 #4（备）</text>
  <text x="764" y="475" class="ts">10.42.0.14</text>
  <text x="764" y="493" class="ts">P0 保证 3 个能动</text>
  <text x="764" y="511" class="ts">现场最多做 6 个</text>

  <!-- 杆 -->
  <line x1="80" y1="580" x2="940" y2="580" stroke="#7f8c9b" stroke-width="4"/>
  <text x="80" y="602" class="ts">既有晾衣杆 20—35mm（不换杆，单元套上去）  演示用 1.2m 铝管</text>

  <path d="M590,340 L440,390" class="lw"/>
  <text x="470" y="372" class="ts" fill="#5ac8a0">Wi-Fi + MQTT（心跳/命令/状态）</text>

  <text x="40" y="646" class="ts">注：所有电流/时长数字为设计值（详见 docs/05 §8），实际以现场实测为准。</text>
</svg>
