<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bgU" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06080b"/><stop offset="1" stop-color="#0b1017"/>
    </linearGradient>
    <linearGradient id="panelU" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b23"/><stop offset="1" stop-color="#0d131a"/>
    </linearGradient>
    <marker id="dotU" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4">
      <circle cx="3" cy="3" r="2.2" fill="#d6b173"/>
    </marker>
  </defs>
  <rect width="1600" height="1100" fill="url(#bgU)"/>
  <g opacity=".045" stroke="#ffffff">
    <path d="M0 100H1600M0 300H1600M0 500H1600M0 700H1600M0 900H1600"/>
    <path d="M200 0V1100M400 0V1100M600 0V1100M800 0V1100M1000 0V1100M1200 0V1100M1400 0V1100"/>
  </g>

  <text x="60" y="58" fill="#d6b173" font-family="Microsoft YaHei, sans-serif" font-size="14" letter-spacing="4">HANDFLOW · V2 UNIT WIRING</text>
  <text x="60" y="100" fill="#eef2f8" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700">伸缩圆柱接线图（单元 01—07 通用）</text>
  <text x="60" y="132" fill="#98a4b5" font-family="Microsoft YaHei, sans-serif" font-size="14">ESP32-C3 SuperMini · DRV8833 · N20 6V 30rpm + T8 丝杆 8mm · AS5600 · 双端锥面收口夹头（套筒 5—8mm，4× 微动：限位 2 + 锁位 2）· 1000mAh 18650</text>

  <!-- ============ POWER CHAIN ============ -->
  <g font-family="Microsoft YaHei, sans-serif">
    <text x="60" y="185" fill="#d6b173" font-size="15" font-weight="700">① 电源链路</text>

    <rect x="70" y="200" width="230" height="66" rx="8" fill="url(#panelU)" stroke="#38424f"/>
    <text x="185" y="228" fill="#eef2f8" font-size="14" text-anchor="middle">18650 1000mAh</text>
    <text x="185" y="250" fill="#98a4b5" font-size="12" text-anchor="middle">3.0—4.2V · 带保护板</text>

    <rect x="70" y="300" width="230" height="74" rx="8" fill="url(#panelU)" stroke="#38424f"/>
    <text x="185" y="326" fill="#eef2f8" font-size="14" text-anchor="middle">TP4056（Type-C）</text>
    <text x="185" y="348" fill="#98a4b5" font-size="12" text-anchor="middle">Rprog 2.4k → 500mA</text>
    <text x="185" y="364" fill="#98a4b5" font-size="12" text-anchor="middle">B+/B− · OUT+/OUT−</text>

    <rect x="90" y="408" width="190" height="50" rx="8" fill="url(#panelU)" stroke="#38424f"/>
    <text x="185" y="439" fill="#eef2f8" font-size="14" text-anchor="middle">电源开关 SS12D00</text>

    <rect x="70" y="492" width="230" height="52" rx="8" fill="#1c1a12" stroke="#d6b173"/>
    <text x="185" y="514" fill="#f1d69a" font-size="14" text-anchor="middle" font-weight="700">VBAT_SW</text>
    <text x="185" y="533" fill="#98a4b5" font-size="12" text-anchor="middle">3.0—4.2V（不是 5V）</text>

    <rect x="70" y="586" width="230" height="74" rx="8" fill="url(#panelU)" stroke="#38424f"/>
    <text x="185" y="612" fill="#eef2f8" font-size="14" text-anchor="middle">MT3608 升压</text>
    <text x="185" y="634" fill="#98a4b5" font-size="12" text-anchor="middle">空载预调 6.0V · η≈85%</text>
    <text x="185" y="650" fill="#e08a8a" font-size="12" text-anchor="middle">连续≤0.7A / 峰值 1.0A</text>

    <rect x="70" y="700" width="230" height="50" rx="8" fill="#20130f" stroke="#e05a5a"/>
    <text x="185" y="731" fill="#f0a0a0" font-size="14" text-anchor="middle" font-weight="700">+6V0 → DRV8833 VM</text>

    <rect x="70" y="790" width="230" height="70" rx="8" fill="url(#panelU)" stroke="#38424f"/>
    <text x="185" y="814" fill="#eef2f8" font-size="13" text-anchor="middle">100k / 100k 分压</text>
    <text x="185" y="834" fill="#98a4b5" font-size="12" text-anchor="middle">4.2V → 2.10V</text>
    <text x="185" y="850" fill="#98a4b5" font-size="12" text-anchor="middle">→ GPIO0（ADC1_CH0）</text>

    <!-- battery to TP4056: + red, - black -->
    <path d="M150 266V300" stroke="#e05a5a" stroke-width="3"/>
    <path d="M220 266V300" stroke="#5c6673" stroke-width="3"/>
    <text x="146" y="286" fill="#e05a5a" font-size="11" text-anchor="end">B+</text>
    <text x="226" y="286" fill="#98a4b5" font-size="11">B−</text>

    <!-- TP4056 OUT+ to switch, OUT- around right -->
    <path d="M150 374V408" stroke="#e05a5a" stroke-width="3"/>
    <text x="146" y="394" fill="#e05a5a" font-size="11" text-anchor="end">OUT+</text>
    <path d="M220 374H340V546" stroke="#5c6673" stroke-width="3" fill="none"/>
    <path d="M322 546H358M328 554H352M334 562H346" stroke="#5c6673" stroke-width="3" fill="none"/>
    <text x="368" y="552" fill="#98a4b5" font-size="11">GND 汇流点（单点接地）</text>

    <!-- switch to VBAT_SW -->
    <path d="M185 458V492" stroke="#e05a5a" stroke-width="3"/>

    <!-- VBAT_SW to MT3608 -->
    <path d="M150 544V586" stroke="#e05a5a" stroke-width="3"/>
    <!-- MT3608 to 6V -->
    <path d="M150 660V700" stroke="#e05a5a" stroke-width="3"/>

    <!-- VBAT_SW to divider on far left -->
    <path d="M70 518H40V825H70" stroke="#e05a5a" stroke-width="2.5" fill="none" stroke-dasharray="1 0"/>
    <text x="34" y="676" fill="#e08a8a" font-size="11" text-anchor="middle" transform="rotate(-90 34 676)">VBAT_SW</text>

    <!-- note -->
    <text x="60" y="892" fill="#98a4b5" font-size="11.5">⚠ 6V 只进 DRV8833 VM；电池 3.0—4.2V 才可进 SuperMini 的 5V 脚</text>
    <text x="60" y="912" fill="#98a4b5" font-size="11.5">⚠ MT3608 先空载调到 6.0V，再接 DRV8833</text>
  </g>

  <!-- ============ MCU ============ -->
  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="700" y="170" width="360" height="730" rx="18" fill="url(#panelU)" stroke="#d6b173" stroke-width="2"/>
    <text x="880" y="212" fill="#f1d69a" font-size="20" text-anchor="middle" font-weight="700">ESP32-C3 SuperMini</text>
    <text x="880" y="238" fill="#98a4b5" font-size="12" text-anchor="middle">RISC-V 160MHz · 4MB Flash · USB-C 烧录</text>
    <text x="880" y="258" fill="#7e8b9c" font-size="11" text-anchor="middle">3.3V 逻辑 · 不用 CH340</text>

    <!-- pin rows: left -->
    <g font-size="12.5">
      <text x="654" y="305" text-anchor="end" fill="#f0a0a0">5V ← VBAT_SW</text>
      <text x="654" y="345" text-anchor="end" fill="#c3ccd8">GND</text>
      <text x="654" y="385" text-anchor="end" fill="#e8a33d">3V3 →</text>
      <text x="654" y="445" text-anchor="end" fill="#e05a5a">GPIO0 ← BAT_SENSE</text>
      <text x="654" y="490" text-anchor="end" fill="#b07be0">GPIO1 ← LOCK_A（套筒锁位）</text>
      <text x="654" y="535" text-anchor="end" fill="#4a9de0">GPIO2 → LED_DIN（10k↑）</text>
      <text x="654" y="580" text-anchor="end" fill="#4fbf7b">GPIO3 ← LIM_MIN</text>
      <text x="654" y="650" text-anchor="end" fill="#6f7b8a">GPIO8 禁接</text>
      <text x="654" y="690" text-anchor="end" fill="#4a9de0">GPIO9 ← KEY（并 BOOT）</text>
      <text x="654" y="760" text-anchor="end" fill="#6f7b8a">GPIO18/19  USB D−/D+</text>

      <!-- pin stubs -->
      <path d="M700 300H660" stroke="#e05a5a" stroke-width="2.5"/>
      <path d="M700 340H660" stroke="#5c6673" stroke-width="2.5"/>
      <path d="M700 380H660" stroke="#e8a33d" stroke-width="2.5"/>
      <path d="M700 440H660" stroke="#e05a5a" stroke-width="2.5"/>
      <path d="M700 485H660" stroke="#b07be0" stroke-width="2.5"/>
      <path d="M700 530H660" stroke="#4a9de0" stroke-width="2.5"/>
      <path d="M700 575H660" stroke="#4fbf7b" stroke-width="2.5"/>
      <path d="M700 645H660" stroke="#3a434f" stroke-width="2.5"/>
      <path d="M700 685H660" stroke="#4a9de0" stroke-width="2.5"/>
      <path d="M700 755H660" stroke="#3a434f" stroke-width="2.5"/>
    </g>

    <!-- pin rows: right（块内=GPIO 名，块外=网络名） -->
    <g font-size="12">
      <text x="1045" y="305" text-anchor="end" fill="#7e8b9c">GPIO4</text>
      <text x="1045" y="350" text-anchor="end" fill="#7e8b9c">GPIO5</text>
      <text x="1045" y="395" text-anchor="end" fill="#7e8b9c">GPIO10</text>
      <text x="1045" y="455" text-anchor="end" fill="#7e8b9c">GPIO6</text>
      <text x="1045" y="500" text-anchor="end" fill="#7e8b9c">GPIO7</text>
      <text x="1045" y="580" text-anchor="end" fill="#7e8b9c">GPIO20</text>
      <text x="1045" y="650" text-anchor="end" fill="#7e8b9c">GPIO21</text>

      <text x="1106" y="305" fill="#4a9de0">AIN1</text>
      <text x="1106" y="350" fill="#4a9de0">AIN2</text>
      <text x="1106" y="395" fill="#4a9de0">nSLEEP</text>
      <text x="1106" y="455" fill="#4fbf7b">SDA</text>
      <text x="1106" y="500" fill="#4fbf7b">SCL</text>
      <text x="1106" y="580" fill="#4fbf7b">LIM_MAX</text>
      <text x="1106" y="650" fill="#b07be0">LOCK_B（1k）</text>

      <path d="M1060 300H1100" stroke="#4a9de0" stroke-width="2.5"/>
      <path d="M1060 345H1100" stroke="#4a9de0" stroke-width="2.5"/>
      <path d="M1060 390H1100" stroke="#4a9de0" stroke-width="2.5"/>
      <path d="M1060 450H1100" stroke="#4fbf7b" stroke-width="2.5"/>
      <path d="M1060 495H1100" stroke="#4fbf7b" stroke-width="2.5"/>
      <path d="M1060 575H1100" stroke="#4fbf7b" stroke-width="2.5"/>
      <path d="M1060 645H1100" stroke="#b07be0" stroke-width="2.5"/>
    </g>

    <!-- length math -->
    <rect x="720" y="676" width="320" height="104" rx="8" fill="#101a12" stroke="#4fbf7b" stroke-width="1"/>
    <text x="738" y="698" fill="#4fbf7b" font-size="12" font-weight="700">长度换算（固件注释）</text>
    <text x="738" y="720" fill="#d8e6dc" font-size="12">L_mm = 40 + counts ÷ 512</text>
    <text x="738" y="740" fill="#9fb5a6" font-size="11">512 counts/mm = 4096/转 ÷ 8mm 导程</text>
    <text x="738" y="758" fill="#9fb5a6" font-size="11">满行程 92,160 counts；多圈计数存 NVS</text>
    <text x="738" y="774" fill="#9fb5a6" font-size="11">上电与限位交叉校验，不一致→自动归零</text>

    <!-- strapping warning inside -->
    <rect x="720" y="800" width="320" height="88" rx="8" fill="#1d1410" stroke="#e05a5a" stroke-width="1.2"/>
    <text x="738" y="822" fill="#f0a0a0" font-size="12" font-weight="700">strapping / 复用引脚</text>
    <text x="738" y="842" fill="#d8c2c2" font-size="11">GPIO2 上电为高（10k↑）；GPIO8 悬空</text>
    <text x="738" y="860" fill="#d8c2c2" font-size="11">GPIO9 只接按键（并 BOOT，别按住开机）</text>
    <text x="738" y="878" fill="#d8c2c2" font-size="11">GPIO21 只接 LOCK_B（串 1k，UART TX 复用）</text>
  </g>

  <!-- ============ RIGHT BLOCKS ============ -->
  <g font-family="Microsoft YaHei, sans-serif">
    <!-- DRV8833 -->
    <rect x="1240" y="190" width="310" height="150" rx="10" fill="url(#panelU)" stroke="#38424f"/>
    <text x="1395" y="216" fill="#eef2f8" font-size="14" text-anchor="middle" font-weight="700">DRV8833（只用 A 通道）</text>
    <text x="1395" y="236" fill="#98a4b5" font-size="11" text-anchor="middle">VM 2.7—10.8V · 1.5A RMS</text>
    <text x="1256" y="264" fill="#e08a8a" font-size="12">VM ← +6V0</text>
    <text x="1256" y="284" fill="#4a9de0" font-size="12">AIN1 / AIN2 ← GPIO4 / GPIO5</text>
    <text x="1256" y="304" fill="#4a9de0" font-size="12">nSLEEP ← GPIO10（10k↓）</text>
    <text x="1256" y="324" fill="#98a4b5" font-size="12">BIN1 / BIN2 / GND → GND</text>
    <text x="1534" y="264" fill="#e8d24a" font-size="12" text-anchor="end">AOUT1</text>
    <text x="1534" y="284" fill="#e8d24a" font-size="12" text-anchor="end">AOUT2</text>
    <!-- AOUT lines down to N20 -->
    <path d="M1400 340V400" stroke="#e8d24a" stroke-width="2.5"/>
    <path d="M1450 340V400" stroke="#e8d24a" stroke-width="2.5"/>
    <text x="1406" y="372" fill="#e8d24a" font-size="11">M+</text>
    <text x="1456" y="372" fill="#e8d24a" font-size="11">M−</text>

    <!-- N20 -->
    <rect x="1240" y="400" width="310" height="86" rx="10" fill="url(#panelU)" stroke="#38424f"/>
    <text x="1395" y="426" fill="#eef2f8" font-size="14" text-anchor="middle" font-weight="700">N20 6V 30rpm（1:298）</text>
    <text x="1395" y="448" fill="#98a4b5" font-size="11.5" text-anchor="middle">+ T8 梯形丝杆 · 导程 8mm · 180mm 行程</text>
    <text x="1395" y="468" fill="#98a4b5" font-size="11.5" text-anchor="middle">4mm/s · 全行程 45s · 推力 20—30N</text>

    <!-- AS5600 -->
    <rect x="1240" y="520" width="310" height="120" rx="10" fill="url(#panelU)" stroke="#38424f"/>
    <text x="1395" y="546" fill="#eef2f8" font-size="14" text-anchor="middle" font-weight="700">AS5600 磁编码（I2C 0x36）</text>
    <text x="1256" y="572" fill="#e8a33d" font-size="12">VCC ← +3V3</text>
    <text x="1256" y="592" fill="#4fbf7b" font-size="12">SDA / SCL ← GPIO6 / GPIO7（4.7k↑）</text>
    <text x="1256" y="612" fill="#98a4b5" font-size="12">DIR → GND · GPO 悬空</text>
    <text x="1256" y="630" fill="#d6b173" font-size="11.5">磁铁 Ø6×2.5 粘丝杆尾端，气隙 0.5—3mm</text>

    <!-- LIMITS + CLAMPS -->
    <rect x="1240" y="672" width="310" height="142" rx="10" fill="url(#panelU)" stroke="#38424f"/>
    <text x="1395" y="696" fill="#eef2f8" font-size="14" text-anchor="middle" font-weight="700">限位 + 套筒锁位（4× 微动）</text>
    <text x="1256" y="720" fill="#4fbf7b" font-size="11.5">LIM_MIN → GPIO3（L=40mm，触发=低）</text>
    <text x="1256" y="738" fill="#4fbf7b" font-size="11.5">LIM_MAX → GPIO20（L=220mm，触发=低）</text>
    <text x="1256" y="756" fill="#b07be0" font-size="11.5">LOCK_A → GPIO1（套筒锁位，锁=低）</text>
    <text x="1256" y="774" fill="#b07be0" font-size="11.5">LOCK_B → GPIO21（串 1k，套筒锁位）</text>
    <text x="1256" y="792" fill="#98a4b5" font-size="11.5">COM → GND · 100nF · 断线=未锁=禁动</text>

    <!-- WS2812 -->
    <rect x="1240" y="838" width="310" height="74" rx="10" fill="url(#panelU)" stroke="#38424f"/>
    <text x="1395" y="862" fill="#eef2f8" font-size="14" text-anchor="middle" font-weight="700">WS2812B-2020 状态灯</text>
    <text x="1256" y="884" fill="#e8a33d" font-size="12">VDD ← +3V3（100nF）</text>
    <text x="1256" y="902" fill="#4a9de0" font-size="12">DIN ← GPIO2（串 330Ω）</text>

    <!-- button -->
    <rect x="1240" y="930" width="310" height="66" rx="10" fill="url(#panelU)" stroke="#38424f"/>
    <text x="1395" y="954" fill="#eef2f8" font-size="14" text-anchor="middle" font-weight="700">按键（6×6 轻触）</text>
    <text x="1256" y="976" fill="#4a9de0" font-size="12">KEY → GPIO9（并 BOOT，100nF）</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="60" y="960" width="1120" height="110" rx="10" fill="#0c1117" stroke="#2a333f"/>
    <text x="80" y="988" fill="#d6b173" font-size="13" font-weight="700">图例</text>
    <rect x="80" y="1002" width="22" height="6" rx="3" fill="#e05a5a"/><text x="110" y="1010" fill="#c3ccd8" font-size="12">VBAT / +6V0（AWG24/26）</text>
    <rect x="300" y="1002" width="22" height="6" rx="3" fill="#5c6673"/><text x="330" y="1010" fill="#c3ccd8" font-size="12">GND（单点汇于 TP4056 OUT−）</text>
    <rect x="590" y="1002" width="22" height="6" rx="3" fill="#e8a33d"/><text x="620" y="1010" fill="#c3ccd8" font-size="12">+3V3</text>
    <rect x="700" y="1002" width="22" height="6" rx="3" fill="#4fbf7b"/><text x="730" y="1010" fill="#c3ccd8" font-size="12">I2C / 限位（AWG28）</text>
    <rect x="880" y="1002" width="22" height="6" rx="3" fill="#4a9de0"/><text x="910" y="1010" fill="#c3ccd8" font-size="12">控制信号</text>
    <rect x="1010" y="1002" width="22" height="6" rx="3" fill="#e8d24a"/><text x="1040" y="1010" fill="#c3ccd8" font-size="12">电机相线（AWG26 双绞）</text>
    <rect x="80" y="1028" width="22" height="6" rx="3" fill="#b07be0"/><text x="110" y="1036" fill="#c3ccd8" font-size="12">夹持状态 LOCK_A/B（锁=低；断线=高=未锁=禁动）</text>
    <text x="420" y="1036" fill="#98a4b5" font-size="12">夹持联锁：恰好一端锁才允许伸缩；两端都锁/都松 → 禁止运动（E13）</text>
    <text x="80" y="1058" fill="#98a4b5" font-size="12">同名网络标签即相互连接；本图省略 3V3/GND 的总线走线，实际按短距离就近连接。完整逐网络表见 netlist-unit-v2.csv。</text>
  </g>

  <!-- footer -->
  <text x="60" y="1088" fill="#5b6779" font-family="Microsoft YaHei, sans-serif" font-size="11">衣序 HangFlow v2 · hardware/wiring-v2/diagram-unit-v2.svg · 2026-11-23 · 与 docs/v2/02-电控与BOM.md §3/§4 对应</text>
</svg>



