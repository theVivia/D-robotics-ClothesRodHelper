<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0;background:#fff;font:12px monospace}iframe{width:390px;height:844px;border:0}pre{padding:10px;white-space:pre-wrap}</style></head><body><iframe id="f"></iframe><pre id="r">run</pre><script>
(async function(){var f=document.getElementById('f'),d,out={};function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function txt(e){return e?e.textContent.replace(/\s+/g,' ').trim():null}function vals(){return Array.prototype.slice.call(d.querySelectorAll('.cyl-row .row-val')).map(txt)}function pos(i){var e=d.querySelectorAll('.cyl')[i],r=e.getBoundingClientRect();return Math.round(r.left*10)/10+'-'+Math.round(r.right*10)/10}function dragHandle(i,side,mm){var h=d.querySelector('.cyl[data-index="'+i+'"] .handle-'+(side==='l'?'left':'right'));var cyl=d.querySelector('.cyl[data-index="'+i+'"]');var width=cyl.getBoundingClientRect().width;var cm=parseFloat(txt(d.querySelectorAll('.cyl-row .row-val')[i]))||10;var scale=width/(cm*10);var dx=mm*scale,r=h.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,id=50;h.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,button:0,clientX:x,clientY:y,pointerId:id}));h.dispatchEvent(new PointerEvent('pointermove',{bubbles:true,clientX:x+dx,clientY:y,pointerId:id}));h.dispatchEvent(new PointerEvent('pointerup',{bubbles:true,clientX:x+dx,clientY:y,pointerId:id}))}
var html=await(await fetch('index.html')).text();var shim='<scr'+'ipt>window.requestAnimationFrame=function(fn){return setTimeout(function(){fn(performance.now())},16)};</scr'+'ipt>';f.addEventListener('load',async function(){d=f.contentDocument;await sleep(700);out.before={vals:vals(),left:pos(0),right:pos(4)};dragHandle(1,'r',20);await sleep(300);out.afterInternal={vals:vals(),left:pos(0),right:pos(4),toast:txt(d.getElementById('toast'))};dragHandle(0,'r',10);await sleep(300);out.afterEnd={vals:vals(),left:pos(0),right:pos(4),toast:txt(d.getElementById('toast'))};d.querySelector('.cyl[data-index="2"] .clamp-left').click();await sleep(200);var before=vals();dragHandle(2,'l',10);await sleep(300);out.bothLocked={before:before,after:vals(),toast:txt(d.getElementById('toast'))};document.getElementById('r').textContent=JSON.stringify(out,null,1)},{once:true});f.srcdoc=html.replace('<head>','<head>'+shim)})();
</script></body></html>
