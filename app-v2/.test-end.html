<!DOCTYPE html><html><head><meta charset="UTF-8"><style>html,body{margin:0;background:#fff;color:#111;font:12px monospace}iframe{width:390px;height:844px;border:0}pre{padding:10px;white-space:pre-wrap}</style></head><body><iframe id="f"></iframe><pre id="r">run</pre><script>
(async function(){var f=document.getElementById('f'),d,out={steps:[]},errors=[];function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function txt(e){return e?e.textContent.replace(/\s+/g,' ').trim():null}function vals(){return Array.prototype.slice.call(d.querySelectorAll('.cyl-row .row-val')).map(txt)}function pos(i){var e=d.querySelectorAll('.cyl')[i],r=e.getBoundingClientRect();return Math.round(r.left*10)/10+'-'+Math.round(r.right*10)/10}function snap(n){out.steps.push({n:n,vals:vals(),chain:txt(d.getElementById('statChain')),avail:txt(d.getElementById('statAvail')),remain:txt(d.getElementById('statSlack')),toast:txt(d.getElementById('toast')),outerL:pos(0),outerR:pos(d.querySelectorAll('.cyl').length-1),scroll:d.documentElement.scrollWidth+'/'+d.documentElement.clientWidth})}function setTarget(v){var r=d.getElementById('targetRange');r.value=String(v);r.dispatchEvent(new Event('input',{bubbles:true}));r.dispatchEvent(new Event('change',{bubbles:true}))}function clickMode(m){d.querySelector('.mode[data-mode="'+m+'"]').click()}
var html=await(await fetch('index.html')).text();var shim='<scr'+'ipt>window.requestAnimationFrame=function(fn){return setTimeout(function(){fn(performance.now())},16)};</scr'+'ipt>';f.addEventListener('load',async function(){d=f.contentDocument;await sleep(700);snap('default');setTarget(12);clickMode('equal');await sleep(1200);snap('equal-12');setTarget(8);clickMode('equal');await sleep(800);snap('equal-8-reject');setTarget(15);clickMode('equal');await sleep(800);snap('equal-15-reject');setTarget(20);clickMode('equal');await sleep(800);snap('equal-20-reject');setTarget(12);clickMode('equal');await sleep(1000);clickMode('collect');await sleep(1200);snap('collect');out.errors=errors;document.getElementById('r').textContent=JSON.stringify(out,null,1)},{once:true});f.srcdoc=html.replace('<head>','<head>'+shim)})();
</script></body></html>
