      <stop offset="0.5" stop-color="#2E3742"/>
      <stop offset="1" stop-color="#20272F"/>
    </linearGradient>
    <linearGradient id="fabD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#252D37"/>
      <stop offset="0.5" stop-color="#363F4C"/>
      <stop offset="1" stop-color="#252D37"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D4A24C" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#D4A24C" stop-opacity="0"/>
    </radialGradient>
    <marker id="dimArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D4A24C"/>
