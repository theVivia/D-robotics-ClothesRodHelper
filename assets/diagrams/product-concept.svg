      <path d="M56 0H0V56" fill="none" stroke="#1A2028" stroke-width="1"/>
    </pattern>
    <linearGradient id="rodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#434D5B"/>
      <stop offset="0.45" stop-color="#2C343F"/>
      <stop offset="1" stop-color="#171D24"/>
    </linearGradient>
    <linearGradient id="modGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28303B"/>
      <stop offset="1" stop-color="#141A21"/>
    </linearGradient>
    <linearGradient id="fabA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#232A34"/>
      <stop offset="0.5" stop-color="#333C48"/>
      <stop offset="1" stop-color="#232A34"/>
