<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="衣序 HangFlow 产品概念图">
  <title>衣序 HangFlow · 产品概念图</title>
  <desc>一根既有晾衣杆上夹着 4 个套挂单元，衣服挂在单元上并被拉开风道；右下角是 RDK X5 中枢与 USB 相机，左下角是手机网页控制界面。</desc>

  <defs>
