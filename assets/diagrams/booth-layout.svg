<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-label="衣序 HangFlow 展台布置俯视图">
  <title>衣序 HangFlow · 展台布置（俯视图）</title>
  <desc>展位俯视示意：深色背景板、10 寸屏、二维码立牌、1.2 米演示杆、4 个单元、三脚架相机、小桌与评委通道。</desc>

  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#161C23" stroke-width="1"/>
    </pattern>
    <marker id="arrG" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D4A24C"/>
    </marker>
    <marker id="arrUp" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D4A24C"/>
    </marker>
  </defs>

  <style>
    .t { fill: #E8EAED; font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif; }
    .m { fill: #9AA3AF; font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif; }
    .d { fill: #6B7480; font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif; }
    .g { fill: #D4A24C; font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif; }
  </style>

  <rect width="1400" height="900" fill="#0B0D10"/>
  <rect width="1400" height="900" fill="url(#grid)" opacity="0.5"/>

  <!-- 标题 -->
  <rect x="56" y="46" width="5" height="30" rx="2.5" fill="#D4A24C"/>
  <text class="t" x="74" y="70" font-size="26" font-weight="bold">展台布置（俯视图）</text>
  <text class="m" x="74" y="96" font-size="12.5">3.0 m × 2.4 m 展位 ｜ 杆高 1.45 m ｜ 评委从前方 1.2 m 通道进入 ｜ 示意图，不按比例</text>

  <!-- 展位边界 -->
  <rect x="80" y="130" width="980" height="660" rx="16" fill="#0E1217" stroke="#2F3742" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text class="d" x="100" y="776" font-size="10.5">展位区</text>

  <!-- 尺寸标注 -->
  <line x1="80" y1="118" x2="1060" y2="118" stroke="#6B7480" stroke-width="1"/>
  <line x1="80" y1="112" x2="80" y2="124" stroke="#6B7480" stroke-width="1.5"/>
  <line x1="1060" y1="112" x2="1060" y2="124" stroke="#6B7480" stroke-width="1.5"/>
  <text class="g" x="570" y="109" font-size="11.5" text-anchor="middle">3.0 m</text>
  <line x1="64" y1="130" x2="64" y2="790" stroke="#6B7480" stroke-width="1"/>
  <line x1="58" y1="130" x2="70" y2="130" stroke="#6B7480" stroke-width="1.5"/>
  <line x1="58" y1="790" x2="70" y2="790" stroke="#6B7480" stroke-width="1.5"/>
  <text class="g" x="52" y="460" font-size="11.5" text-anchor="middle" transform="rotate(-90 52 460)">2.4 m</text>

  <!-- 背景板 -->
  <rect x="110" y="150" width="920" height="38" rx="6" fill="#12161C" stroke="#3A4350" stroke-width="1.2"/>
  <text class="t" x="570" y="175" font-size="12.5" text-anchor="middle">背景板（深色）：衣序 HangFlow · 不换晾衣杆，让衣服自己让出风道</text>

  <!-- 10 寸屏 -->
  <rect x="150" y="210" width="180" height="48" rx="8" fill="#171D25" stroke="#2F3742" stroke-width="1.2"/>
  <text class="t" x="240" y="230" font-size="12" font-weight="bold" text-anchor="middle">10 寸屏</text>
  <text class="m" x="240" y="247" font-size="9.5" text-anchor="middle">循环演示视频</text>

  <!-- 二维码立牌 -->
  <rect x="850" y="210" width="100" height="48" rx="8" fill="#171D25" stroke="#2F3742" stroke-width="1.2"/>
  <rect x="864" y="220" width="9" height="9" fill="none" stroke="#D4A24C" stroke-width="1.6"/>
  <rect x="877" y="220" width="9" height="9" fill="none" stroke="#D4A24C" stroke-width="1.6"/>
  <rect x="864" y="233" width="9" height="9" fill="none" stroke="#D4A24C" stroke-width="1.6"/>
  <rect x="878" y="234" width="5" height="5" fill="#D4A24C"/>
  <text class="m" x="900" y="272" font-size="9" text-anchor="middle">二维码立牌（扫码进网页）</text>

  <!-- 补光灯 -->
  <circle cx="280" cy="390" r="13" fill="#12161C" stroke="#D4A24C" stroke-width="1.5"/>
  <g stroke="#D4A24C" stroke-width="1.4" opacity="0.8">
    <line x1="280" y1="370" x2="280" y2="374"/>
    <line x1="280" y1="406" x2="280" y2="410"/>
    <line x1="260" y1="390" x2="264" y2="390"/>
    <line x1="296" y1="390" x2="300" y2="390"/>
    <line x1="266" y1="376" x2="269" y2="379"/>
    <line x1="294" y1="376" x2="291" y2="379"/>
  </g>
  <line x1="290" y1="400" x2="370" y2="466" stroke="#D4A24C" stroke-width="1" stroke-dasharray="5 6" opacity="0.2"/>
  <line x1="290" y1="400" x2="500" y2="466" stroke="#D4A24C" stroke-width="1" stroke-dasharray="5 6" opacity="0.2"/>
  <text class="m" x="280" y="424" font-size="9.5" text-anchor="middle">补光灯（斜上方）</text>

  <!-- 演示杆 -->
  <text class="g" x="630" y="452" font-size="12" text-anchor="middle">演示杆 1.2 m（杆高 1.45 m）</text>
  <rect x="352" y="462" width="16" height="16" rx="3" fill="#8A6B33" stroke="#D4A24C" stroke-width="1.2"/>
  <line x1="370" y1="470" x2="890" y2="470" stroke="#D4A24C" stroke-width="8" stroke-linecap="round"/>

  <!-- 4 个单元 + 衣物占位 -->
  <g>
    <rect x="423" y="480" width="14" height="150" rx="2" fill="#1A2028" stroke="#2E3742"/>
    <rect x="553" y="480" width="14" height="150" rx="2" fill="#1A2028" stroke="#2E3742"/>
    <rect x="683" y="480" width="14" height="150" rx="2" fill="#1A2028" stroke="#2E3742"/>
    <rect x="813" y="480" width="14" height="150" rx="2" fill="#1A2028" stroke="#2E3742"/>
    <rect x="420" y="622" width="20" height="7" rx="2" fill="#2E3742"/>
    <rect x="550" y="622" width="20" height="7" rx="2" fill="#2E3742"/>
    <rect x="680" y="622" width="20" height="7" rx="2" fill="#2E3742"/>
    <rect x="810" y="622" width="20" height="7" rx="2" fill="#2E3742"/>
  </g>
  <g>
    <circle cx="430" cy="470" r="12" fill="#12161C" stroke="#D4A24C" stroke-width="2"/>
    <text class="g" x="430" y="474" font-size="10.5" text-anchor="middle" font-weight="bold">1</text>
    <circle cx="560" cy="470" r="12" fill="#12161C" stroke="#D4A24C" stroke-width="2"/>
    <text class="g" x="560" y="474" font-size="10.5" text-anchor="middle" font-weight="bold">2</text>
    <circle cx="690" cy="470" r="12" fill="#12161C" stroke="#D4A24C" stroke-width="2"/>
    <text class="g" x="690" y="474" font-size="10.5" text-anchor="middle" font-weight="bold">3</text>
    <circle cx="820" cy="470" r="12" fill="#12161C" stroke="#D4A24C" stroke-width="2"/>
    <text class="g" x="820" y="474" font-size="10.5" text-anchor="middle" font-weight="bold">4</text>
  </g>
  <text class="m" x="744" y="656" font-size="9.5">衣物占位（沿杆厚度 t ≈ 3–6 cm）</text>
  <text class="d" x="352" y="500" font-size="8.5" text-anchor="end">归零挡块</text>

  <!-- 小桌 -->
  <rect x="120" y="620" width="200" height="150" rx="8" fill="#12161C" stroke="#2F3742" stroke-width="1.2"/>
  <text class="t" x="136" y="646" font-size="12" font-weight="bold">小桌</text>
  <text class="m" x="136" y="668" font-size="9.5">备用单元 / 工具</text>
  <text class="m" x="136" y="686" font-size="9.5">充电宝 / 电池 / 线材</text>

  <!-- 插排 -->
  <rect x="342" y="712" width="94" height="26" rx="4" fill="#1A2028" stroke="#3A4350" stroke-width="1.2"/>
  <circle cx="362" cy="725" r="3" fill="#D4A24C" opacity="0.7"/>
  <circle cx="380" cy="725" r="3" fill="#D4A24C" opacity="0.7"/>
  <circle cx="398" cy="725" r="3" fill="#D4A24C" opacity="0.7"/>
  <text class="d" x="389" y="756" font-size="8.5" text-anchor="middle">插排（RDK 单独一路）</text>

  <!-- 相机（侧面） -->
  <polygon points="944,628 380,470 880,470" fill="#D4A24C" opacity="0.04"/>
  <line x1="944" y1="628" x2="380" y2="470" stroke="#D4A24C" stroke-width="1" stroke-dasharray="5 6" opacity="0.3"/>
  <line x1="944" y1="628" x2="880" y2="470" stroke="#D4A24C" stroke-width="1" stroke-dasharray="5 6" opacity="0.3"/>
  <line x1="950" y1="654" x2="920" y2="722" stroke="#3A4350" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="950" y1="654" x2="980" y2="722" stroke="#3A4350" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="950" y1="654" x2="952" y2="718" stroke="#3A4350" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="950" cy="646" r="12" fill="#12161C" stroke="#3A4350" stroke-width="1.4"/>
  <rect x="934" y="622" width="34" height="20" rx="4" fill="#1A2028" stroke="#4A5563" stroke-width="1.2"/>
  <circle cx="932" cy="630" r="6" fill="#0B0D10" stroke="#D4A24C" stroke-width="1.4"/>
  <text class="t" x="950" y="748" font-size="10" text-anchor="middle" font-weight="bold">相机三脚架</text>
  <text class="m" x="950" y="764" font-size="9" text-anchor="middle">侧面 1.5 m，不挡评委</text>

  <!-- 地面胶带 -->
  <line x1="82" y1="798" x2="1058" y2="798" stroke="#D4A24C" stroke-width="1.4" stroke-dasharray="3 5" opacity="0.55"/>

  <!-- 评委通道 -->
  <rect x="60" y="820" width="1280" height="48" rx="10" fill="#0E1217" stroke="#D4A24C" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.95"/>
  <text class="g" x="700" y="849" font-size="12" text-anchor="middle">评委通道 1.2 m（示意）· 站位正对演示杆，平视就能看清间隙</text>
  <line x1="200" y1="812" x2="200" y2="800" stroke="#D4A24C" stroke-width="2" marker-end="url(#arrUp)"/>
  <line x1="700" y1="812" x2="700" y2="800" stroke="#D4A24C" stroke-width="2" marker-end="url(#arrUp)"/>
  <line x1="1200" y1="812" x2="1200" y2="800" stroke="#D4A24C" stroke-width="2" marker-end="url(#arrUp)"/>

  <!-- 图例 -->
  <rect x="1090" y="150" width="250" height="252" rx="10" fill="#12161C" stroke="#232A33" stroke-width="1.2"/>
  <text class="g" x="1108" y="176" font-size="12.5" font-weight="bold">图例</text>
  <line x1="1108" y1="202" x2="1140" y2="202" stroke="#D4A24C" stroke-width="4" stroke-linecap="round"/>
  <text class="m" x="1152" y="206" font-size="10">演示杆 / 关键设备</text>
  <rect x="1108" y="220" width="32" height="14" fill="#171D25" stroke="#2F3742" stroke-width="1"/>
  <text class="m" x="1152" y="232" font-size="10">屏幕 / 家具 / 设备</text>
  <line x1="1108" y1="256" x2="1140" y2="256" stroke="#6B7480" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="m" x="1152" y="260" font-size="10">边界 / 通道</text>
  <circle cx="1124" cy="286" r="8" fill="#12161C" stroke="#D4A24C" stroke-width="2"/>
  <text class="g" x="1124" y="290" font-size="9" text-anchor="middle">1</text>
  <text class="m" x="1152" y="290" font-size="10">套挂单元 ①–④</text>
  <line x1="1108" y1="316" x2="1134" y2="316" stroke="#D4A24C" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text class="m" x="1152" y="320" font-size="10">评委动线</text>
  <line x1="1108" y1="346" x2="1140" y2="346" stroke="#D4A24C" stroke-width="1.4" stroke-dasharray="3 5"/>
  <text class="m" x="1152" y="350" font-size="10">地面胶带（演示区）</text>
  <line x1="1108" y1="376" x2="1140" y2="376" stroke="#D4A24C" stroke-width="1" stroke-dasharray="6 8" opacity="0.6"/>
  <text class="m" x="1152" y="380" font-size="10">相机视野（示意）</text>

  <!-- 讲解要点 -->
  <rect x="1090" y="422" width="250" height="218" rx="10" fill="#12161C" stroke="#232A33" stroke-width="1.2"/>
  <text class="g" x="1108" y="448" font-size="12.5" font-weight="bold">现场要点</text>
  <text class="m" x="1108" y="474" font-size="9.5">· 杆高 1.45 m：评委平视看间隙</text>
  <text class="m" x="1108" y="498" font-size="9.5">· 相机在侧面：不挡评委视线</text>
  <text class="m" x="1108" y="522" font-size="9.5">· 补光从斜上方：避免衣服阴影</text>
  <text class="m" x="1108" y="546" font-size="9.5">· 深色桌布，线材收进桌下</text>
  <text class="m" x="1108" y="570" font-size="9.5">· 地面贴胶带，防观众碰倒</text>
  <text class="m" x="1108" y="594" font-size="9.5">· 评委可上手：递手机让他拖</text>
  <text class="m" x="1108" y="618" font-size="9.5">· 每轮演示后 10 秒复位</text>

  <text class="d" x="1340" y="884" font-size="9.5" text-anchor="end">对应文档：docs/11 现场 48 小时执行计划 §6 展台布置</text>
</svg>
