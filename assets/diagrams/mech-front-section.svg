  .lead  { fill:none; stroke:#b45309; stroke-width:0.9; }
  .dt    { font:12px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#0f766e; text-anchor:middle;
           paint-order:stroke; stroke:#ffffff; stroke-width:3.5; stroke-linejoin:round; }
  .lb    { font:13px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#7c2d12; }
