<line class="lead" x1="428.0" y1="522.0" x2="556.0" y2="576.0"/>
<circle cx="428.0" cy="522.0" r="2.4" fill="#b45309"/>
<text class="lb" x="556.0" y="580.0" text-anchor="start">挂点钢销（杆轴正下方）</text>
<text class="sub" x="240.0" y="478.0" text-anchor="start">重心 CM ≈ (0, +5, −10)</text>
<text class="sub" x="28.0" y="600.0" text-anchor="start">① 三个接触点（顶轮 + 两惰轮）的法向力都过杆轴心 → 对杆轴的力矩恒为 0；绕杆轴滚转只能靠摩擦抗，</text>
<text class="sub" x="28.0" y="621.0" text-anchor="start">   容量 C = μ·R·ΣN = 0.32 N·m（湿态 μ=0.35），所以挂点偏心必须 ≤8mm，否则模块会绕杆转圈。</text>
<text class="sub" x="28.0" y="642.0" text-anchor="start">② 顶轮正压力 N_f = F_s + W = 25 + 22.1 = 47.1 N（挂 2kg 时）——越重压得越紧，这是抗打滑的根本。</text>
<text class="sub" x="28.0" y="663.0" text-anchor="start">③ 惰轮单轮支反力 N_i = F_s/2 = 12.5 N；沿杆 10N 推力产生支反力差 ΔN = ±4.0 N（后轮仍 8.5 N，不翻）。</text>
