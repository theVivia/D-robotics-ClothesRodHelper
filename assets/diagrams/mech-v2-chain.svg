<text class="lb" x="60" y="112">锥面夹头套筒（行程 6 mm，无外露爪子）：推入=锁死 / 拉出=松开；锁一端=单向伸缩 / 锁两端=定点锁定</text>
<text class="lb" x="24" y="194">顶墙撑脚（行程 25，预紧 10–20 N）</text>
<text class="lb" x="742" y="196">端部段 05 同样带顶墙撑脚</text>
<text class="lb" x="268" y="162">接缝 10 mm：半销端面留 0.5 mm，物理最小缝 4.0 mm</text>

<!-- bottom -->
<g>
  <text class="note" x="60" y="560" font-weight="bold" fill="#0f172a">本版三条锁定口径（与旧 v2 口径的差别）</text>
  <text class="note" x="60" y="588">1. 调节器数量 = K + 1（演示 K=4 → 5 个：01–05），两端也有调节器；旧口径"K−1 个"作废。</text>
  <text class="note" x="60" y="612">2. 取消恒力卷簧。位置由两端的锥面收口夹头钉在杆上：断电不掉位，不靠链张力，也不靠丝杆自锁。</text>
  <text class="note" x="60" y="636">3. 端部段用顶墙撑脚做预紧（力走墙），杆只受竖直载荷；接缝是控制出来的 10 mm，不是弹簧压出来的。</text>
  <text class="note" x="60" y="672" fill="#475569">长度规格：N 窄距 100–130 · M 中距 130–190 · W 宽距 190–220 · E 端部段 90–110 · S 被动短套 40/60/80（无电机，40–100 mm 动力盲区用它）</text>
  <text class="note" x="60" y="696" fill="#475569">速度 4.0 mm/s @ N20 30 rpm（T8×8，η=66.1%）；工况 A 推力 8 N（额定 15 N）· 工况 B 预紧 15 N · 锥面夹头保持力 82 N（设计，要求 ≥40 N）。</text>
  <text class="note" x="60" y="726" fill="#94a3b8">注：夹持环画成端部两道浅色带；凸轮扳手在 +Y 侧（正视图看不到，示意画在顶部）。全部数字为设计值/估算，非实测。</text>
</g>
</svg>
