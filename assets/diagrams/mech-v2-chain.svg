<rect class="bg" width="1520" height="780"/>

<text class="ttl" x="60" y="52">mech-v2 · 链条排列：K 件衣服 = K+1 个调节器（两端也有），双端夹持替代卷簧</text>
<text class="sub" x="60" y="78">墙 — 调节器01 — 衣物1 — 调节器02 — 衣物2 — 调节器03 — 衣物3 — 调节器04 — 衣物4 — 调节器05 — 墙　　比例 1.1 px/mm，演示杆 Ø25 × 1.2 m</text>

