<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06080b"/><stop offset="1" stop-color="#0b1017"/></linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7dbe2"/><stop offset=".45" stop-color="#8d949f"/><stop offset="1" stop-color="#4a505a"/></linearGradient>
    <linearGradient id="outer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3c434e"/><stop offset=".5" stop-color="#232931"/><stop offset="1" stop-color="#12161c"/></linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5a38"/><stop offset=".5" stop-color="#443720"/><stop offset="1" stop-color="#241d11"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1d69a"/><stop offset="1" stop-color="#b08a45"/></linearGradient>
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="10" stroke="#3a4150" stroke-width="3"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d6b173"/></marker>
  </defs>
  <rect width="1500" height="820" fill="url(#bg)"/>
  <g opacity=".05" stroke="#fff"><path d="M0 100H1500M0 240H1500M0 380H1500M0 520H1500M0 660H1500"/><path d="M150 0V820M390 0V820M630 0V820M870 0V820M1110 0V820M1350 0V820"/></g>

  <text x="70" y="62" fill="#d6b173" font-family="Microsoft YaHei, sans-serif" font-size="16" letter-spacing="4">HANGFLOW · V2 CONCEPT</text>
  <text x="70" y="108" fill="#eef2f8" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700">墙—调节器—衣物—调节器—…—调节器—墙</text>
  <text x="70" y="144" fill="#98a4b5" font-family="Microsoft YaHei, sans-serif" font-size="15">K 件衣服 = K+1 个调节器；每个调节器两端各一个锥面收口夹头：套筒内滑锁紧；锁一端=单向伸缩，锁两端=定点拉伸；衣架卡在 10mm 接缝里</text>

  <!-- walls -->
  <g>
    <rect x="58" y="238" width="34" height="144" fill="url(#hatch)" stroke="#3a4150"/>
    <rect x="1408" y="238" width="34" height="144" fill="url(#hatch)" stroke="#3a4150"/>
    <text x="75" y="410" text-anchor="middle" fill="#98a4b5" font-family="Microsoft YaHei, sans-serif" font-size="12">墙/边缘</text>
    <text x="1425" y="410" text-anchor="middle" fill="#98a4b5" font-family="Microsoft YaHei, sans-serif" font-size="12">墙/边缘</text>
  </g>

  <!-- rod -->
  <rect x="70" y="300" width="1360" height="16" rx="8" fill="url(#rod)"/>
  <rect x="70" y="300" width="1360" height="3" rx="1.5" fill="#fff" opacity=".35"/>

  <!-- seams: 4 at 300, 570, 840, 1110 -->
  <g font-family="Microsoft YaHei, sans-serif">
    <g><rect x="295" y="252" width="10" height="112" rx="5" fill="#c9ced6"/><path d="M300 252 v-22 q0 -12 12 -12 q12 0 12 12" fill="none" stroke="url(#gold)" stroke-width="4"/><text x="300" y="392" text-anchor="middle" fill="#d6b173" font-size="12">接缝1</text></g>
    <g><rect x="565" y="252" width="10" height="112" rx="5" fill="#c9ced6"/><path d="M570 252 v-22 q0 -12 12 -12 q12 0 12 12" fill="none" stroke="url(#gold)" stroke-width="4"/><text x="570" y="392" text-anchor="middle" fill="#d6b173" font-size="12">接缝2</text></g>
    <g><rect x="835" y="252" width="10" height="112" rx="5" fill="#c9ced6"/><path d="M840 252 v-22 q0 -12 12 -12 q12 0 12 12" fill="none" stroke="url(#gold)" stroke-width="4"/><text x="840" y="392" text-anchor="middle" fill="#d6b173" font-size="12">接缝3</text></g>
    <g><rect x="1105" y="252" width="10" height="112" rx="5" fill="#c9ced6"/><path d="M1110 252 v-22 q0 -12 12 -12 q12 0 12 12" fill="none" stroke="url(#gold)" stroke-width="4"/><text x="1110" y="392" text-anchor="middle" fill="#d6b173" font-size="12">接缝4</text></g>
  </g>

  <!-- adjusters 5: 90-288, 312-558, 582-828, 852-1098, 1122-1400 -->
  <g>
    <!-- A0: 90..288, end unit short -->
    <rect x="104" y="276" width="150" height="60" rx="30" fill="url(#outer)" stroke="#d6b173" stroke-width="2"/>
    <rect x="254" y="282" width="34" height="48" rx="17" fill="url(#inner)" stroke="#d6b173" stroke-width="2"/>
    <rect x="96" y="264" width="12" height="84" rx="6" fill="url(#gold)"/><rect x="282" y="264" width="12" height="84" rx="6" fill="url(#gold)"/>
    <text x="150" y="312" fill="#f1d69a" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700">01</text>
    <text x="190" y="438" text-anchor="middle" fill="#98a4b5" font-family="Microsoft YaHei, sans-serif" font-size="11">端部段 L0=6cm</text>
    <!-- A1 -->
    <rect x="326" y="276" width="190" height="60" rx="30" fill="url(#outer)" stroke="#d6b173" stroke-width="2"/>
    <rect x="516" y="282" width="34" height="48" rx="17" fill="url(#inner)" stroke="#d6b173" stroke-width="2"/>
    <rect x="318" y="264" width="12" height="84" rx="6" fill="url(#gold)"/><rect x="552" y="264" width="12" height="84" rx="6" fill="url(#gold)"/>
    <text x="372" y="312" fill="#f1d69a" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700">02</text>
    <text x="420" y="438" text-anchor="middle" fill="#98a4b5" font-family="Microsoft YaHei, sans-serif" font-size="11">内部段 L1=10cm</text>
    <!-- A2 -->
    <rect x="596" y="276" width="190" height="60" rx="30" fill="url(#outer)" stroke="#d6b173" stroke-width="2"/>
    <rect x="786" y="282" width="34" height="48" rx="17" fill="url(#inner)" stroke="#d6b173" stroke-width="2"/>
    <rect x="588" y="264" width="12" height="84" rx="6" fill="url(#gold)"/><rect x="822" y="264" width="12" height="84" rx="6" fill="url(#gold)"/>
    <text x="642" y="312" fill="#f1d69a" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700">03</text>
    <text x="690" y="438" text-anchor="middle" fill="#98a4b5" font-family="Microsoft YaHei, sans-serif" font-size="11">内部段 L2=10cm</text>
    <!-- A3 -->
    <rect x="866" y="276" width="190" height="60" rx="30" fill="url(#outer)" stroke="#d6b173" stroke-width="2"/>
    <rect x="1056" y="282" width="34" height="48" rx="17" fill="url(#inner)" stroke="#d6b173" stroke-width="2"/>
    <rect x="858" y="264" width="12" height="84" rx="6" fill="url(#gold)"/><rect x="1092" y="264" width="12" height="84" rx="6" fill="url(#gold)"/>
    <text x="912" y="312" fill="#f1d69a" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700">04</text>
    <text x="960" y="438" text-anchor="middle" fill="#98a4b5" font-family="Microsoft YaHei, sans-serif" font-size="11">内部段 L3=10cm</text>
    <!-- A4 -->
    <rect x="1136" y="276" width="190" height="60" rx="30" fill="url(#outer)" stroke="#d6b173" stroke-width="2"/>
    <rect x="1326" y="282" width="34" height="48" rx="17" fill="url(#inner)" stroke="#d6b173" stroke-width="2"/>
    <rect x="1128" y="264" width="12" height="84" rx="6" fill="url(#gold)"/><rect x="1362" y="264" width="12" height="84" rx="6" fill="url(#gold)"/>
    <text x="1182" y="312" fill="#f1d69a" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="700">05</text>
    <text x="1230" y="438" text-anchor="middle" fill="#98a4b5" font-family="Microsoft YaHei, sans-serif" font-size="11">端部段 L4=6cm</text>
  </g>

  <!-- lock icons at clamps (filled=locked, hollow=unlocked) -->
  <g fill="#d6b173">
    <!-- A1 left locked, right unlocked -->
    <circle cx="324" cy="252" r="7"/><circle cx="558" cy="252" r="7" fill="none" stroke="#d6b173" stroke-width="2"/>
    <!-- A2 left locked, right unlocked -->
    <circle cx="594" cy="252" r="7"/><circle cx="828" cy="252" r="7" fill="none" stroke="#d6b173" stroke-width="2"/>
    <!-- A3 left locked, right unlocked -->
    <circle cx="864" cy="252" r="7"/><circle cx="1098" cy="252" r="7" fill="none" stroke="#d6b173" stroke-width="2"/>
  </g>

  <!-- one-way legend (single, bottom) -->
  <g font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#98a4b5">
    <text x="70" y="566">箭头示意：锁左端 → 右端单向伸出；锁右端 → 左端单向伸出；锁两端 → 定点拉伸/绝对位置</text>
  </g>

  <!-- callouts top -->
  <g font-family="Microsoft YaHei, sans-serif">
    <g><circle cx="190" cy="158" r="13" fill="#d6b173"/><text x="190" y="163" text-anchor="middle" fill="#0b0d10" font-size="14" font-weight="700">1</text>
      <text x="212" y="163" fill="#eef2f8" font-size="15">抱箍两半扣在杆上，不拆杆</text>
      <text x="212" y="186" fill="#98a4b5" font-size="13">锥面收口夹头：套筒向内滑 5—8mm 锁紧</text></g>
    <g><circle cx="655" cy="158" r="13" fill="#d6b173"/><text x="655" y="163" text-anchor="middle" fill="#0b0d10" font-size="14" font-weight="700">2</text>
      <text x="677" y="163" fill="#eef2f8" font-size="15">K 件衣服 = K+1 个调节器</text>
      <text x="677" y="186" fill="#98a4b5" font-size="13">两端各一个，锁杆；够到墙时顶墙预紧</text></g>
    <g><circle cx="1120" cy="158" r="13" fill="#d6b173"/><text x="1120" y="163" text-anchor="middle" fill="#0b0d10" font-size="14" font-weight="700">3</text>
      <text x="1142" y="163" fill="#eef2f8" font-size="15">唯一编码，RDK 视觉智能识别</text>
      <text x="1142" y="186" fill="#98a4b5" font-size="13">装上去什么顺序就什么顺序，不换序</text></g>
  </g>

  <!-- dimensions internal -->
  <g font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#d6b173">
    <path d="M310 486 H560" stroke="#d6b173" stroke-dasharray="4 4"/><path d="M310 478 v16 M560 478 v16" stroke="#d6b173"/>
    <text x="435" y="514" text-anchor="middle">中心距 = L₁ + 1cm；净风道 = L₁</text>
    <path d="M580 486 H830" stroke="#d6b173" stroke-dasharray="4 4"/><path d="M580 478 v16 M830 478 v16" stroke="#d6b173"/>
    <text x="705" y="514" text-anchor="middle">中心距 = L₂ + 1cm；净风道 = L₂</text>
    <path d="M850 486 H1100" stroke="#d6b173" stroke-dasharray="4 4"/><path d="M850 478 v16 M1100 478 v16" stroke="#d6b173"/>
    <text x="975" y="514" text-anchor="middle">中心距 = L₃ + 1cm；净风道 = L₃</text>
  </g>

  <!-- bottom -->
  <g font-family="Microsoft YaHei, sans-serif">
    <text x="70" y="600" fill="#d6b173" font-size="15" font-weight="700">公式（衣架按 1cm 计）</text>
    <text x="70" y="632" fill="#eef2f8" font-size="16">总链长 = ΣL（K+1 段）+ K×1cm + 两端安装余量 ≤ 可用杆长</text>
    <text x="70" y="664" fill="#98a4b5" font-size="14">内部段 L_i = 净风道 g_i；端部段 L_0 / L_K 顶墙预紧，决定两端留白</text>
    <text x="70" y="696" fill="#98a4b5" font-size="14">锥面收口夹头：套筒向内滑=锁紧，拉出=松开；锁一端→单向伸缩，锁两端→定点拉伸/绝对位置</text>
    <text x="70" y="742" fill="#5b6779" font-size="12">注：图中不画衣服，只画衣架接缝；调节器不承重、衣服仍挂在原杆上；已取消恒力卷簧。</text>
  </g>
</svg>


