<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAFBFC"/><stop offset="1" stop-color="#EEF0F3"/></linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9EBEF"/><stop offset=".45" stop-color="#C4C9D1"/><stop offset="1" stop-color="#9AA1AB"/></linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F4F5F7"/><stop offset="1" stop-color="#DFE3E8"/></linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F4F6"/><stop offset=".4" stop-color="#D5D9DF"/><stop offset="1" stop-color="#AEB5BF"/></linearGradient>
    <linearGradient id="tpu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7DBE0"/><stop offset="1" stop-color="#B9BFC7"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1F2937" flood-opacity=".18"/></filter>
    <pattern id="wall" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#E7E9ED"/><line x1="0" y1="0" x2="0" y2="10" stroke="#D2D6DC" stroke-width="3"/></pattern>
  </defs>
  <rect width="1500" height="820" fill="url(#bg)"/>
  <text x="70" y="64" fill="#2F6FED" font-family="Microsoft YaHei, sans-serif" font-size="15" letter-spacing="4">HANGFLOW · 产品形态（家用五金语言）</text>
  <text x="70" y="112" fill="#1F2937" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700">白色哑光外壳 + 银色内管 + 浅灰接缝</text>
  <text x="70" y="148" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="15">两端是墙座（固定端）；中间段两端各一个拇指锁紧扳手，绿点=锁紧、红点=松开；接缝 10mm 是衣架挂点</text>

  <!-- walls -->
  <rect x="58" y="248" width="34" height="150" fill="url(#wall)" stroke="#C9CED6"/>
  <rect x="1408" y="248" width="34" height="150" fill="url(#wall)" stroke="#C9CED6"/>
  <text x="75" y="424" text-anchor="middle" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="12">墙</text>
  <text x="1425" y="424" text-anchor="middle" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="12">墙</text>

  <!-- rod -->
  <rect x="70" y="312" width="1360" height="14" rx="7" fill="url(#rod)"/>

  <!-- wall pads at ends -->
  <rect x="92" y="276" width="10" height="86" rx="5" fill="#BFC5CD"/>
  <rect x="1398" y="276" width="10" height="86" rx="5" fill="#BFC5CD"/>

  <!-- end unit 01: wall bracket + short white housing -->
  <g filter="url(#soft)">
    <rect x="104" y="286" width="150" height="66" rx="33" fill="url(#white)" stroke="#D5DAE1"/>
    <rect x="238" y="294" width="18" height="50" rx="9" fill="url(#tpu)"/>
    <rect x="96" y="300" width="10" height="38" rx="5" fill="#9AA1AB"/>
    <circle cx="184" cy="319" r="4" fill="#12A150"/>
    <text x="148" y="324" fill="#1F2937" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700">01</text>
    <text x="184" y="372" text-anchor="middle" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="12">固定端 · 墙座</text>
  </g>

  <!-- seam 1 with hanger hook -->
  <g>
    <rect x="256" y="282" width="12" height="86" rx="6" fill="url(#tpu)"/>
    <path d="M262 282 v-26 q0 -12 12 -12 q12 0 12 12" fill="none" stroke="#8A919B" stroke-width="3"/>
    <text x="262" y="396" text-anchor="middle" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="12">接缝</text>
  </g>

  <!-- middle unit 02: 268..548, inner alu 400..540 -->
  <g filter="url(#soft)">
    <rect x="268" y="286" width="196" height="66" rx="33" fill="url(#white)" stroke="#D5DAE1"/>
    <rect x="464" y="292" width="76" height="54" rx="27" fill="url(#alu)" stroke="#C9CED6"/>
    <rect x="268" y="300" width="10" height="38" rx="5" fill="#9AA1AB"/>
    <rect x="536" y="300" width="10" height="38" rx="5" fill="#9AA1AB"/>
    <circle cx="290" cy="319" r="4" fill="#12A150"/><circle cx="524" cy="319" r="4" fill="#12A150"/>
    <text x="360" y="324" fill="#1F2937" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700">02</text>
    <text x="408" y="372" text-anchor="middle" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="12">净风道 10cm</text>
  </g>

  <!-- seam 2 -->
  <g>
    <rect x="554" y="282" width="12" height="86" rx="6" fill="url(#tpu)"/>
    <path d="M560 282 v-26 q0 -12 12 -12 q12 0 12 12" fill="none" stroke="#8A919B" stroke-width="3"/>
    <text x="560" y="396" text-anchor="middle" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="12">接缝</text>
  </g>

  <!-- middle 03: 566..846 -->
  <g filter="url(#soft)">
    <rect x="566" y="286" width="196" height="66" rx="33" fill="url(#white)" stroke="#D5DAE1"/>
    <rect x="762" y="292" width="76" height="54" rx="27" fill="url(#alu)" stroke="#C9CED6"/>
    <rect x="566" y="300" width="10" height="38" rx="5" fill="#9AA1AB"/>
    <rect x="834" y="300" width="10" height="38" rx="5" fill="#9AA1AB"/>
    <circle cx="588" cy="319" r="4" fill="#12A150"/><circle cx="822" cy="319" r="4" fill="#12A150"/>
    <text x="658" y="324" fill="#1F2937" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700">03</text>
    <text x="706" y="372" text-anchor="middle" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="12">净风道 10cm</text>
  </g>

  <!-- seam 3 -->
  <g>
    <rect x="852" y="282" width="12" height="86" rx="6" fill="url(#tpu)"/>
    <path d="M858 282 v-26 q0 -12 12 -12 q12 0 12 12" fill="none" stroke="#8A919B" stroke-width="3"/>
    <text x="858" y="396" text-anchor="middle" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="12">接缝</text>
  </g>

  <!-- middle 04: 864..1144 -->
  <g filter="url(#soft)">
    <rect x="864" y="286" width="196" height="66" rx="33" fill="url(#white)" stroke="#D5DAE1"/>
    <rect x="1060" y="292" width="76" height="54" rx="27" fill="url(#alu)" stroke="#C9CED6"/>
    <rect x="864" y="300" width="10" height="38" rx="5" fill="#9AA1AB"/>
    <rect x="1132" y="300" width="10" height="38" rx="5" fill="#9AA1AB"/>
    <circle cx="886" cy="319" r="4" fill="#12A150"/><circle cx="1120" cy="319" r="4" fill="#12A150"/>
    <text x="956" y="324" fill="#1F2937" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700">04</text>
    <text x="1004" y="372" text-anchor="middle" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="12">净风道 10cm</text>
  </g>

  <!-- seam 4 -->
  <g>
    <rect x="1150" y="282" width="12" height="86" rx="6" fill="url(#tpu)"/>
    <path d="M1156 282 v-26 q0 -12 12 -12 q12 0 12 12" fill="none" stroke="#8A919B" stroke-width="3"/>
    <text x="1156" y="396" text-anchor="middle" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="12">接缝</text>
  </g>

  <!-- end unit 05: right wall bracket -->
  <g filter="url(#soft)">
    <rect x="1172" y="286" width="150" height="66" rx="33" fill="url(#white)" stroke="#D5DAE1"/>
    <rect x="1172" y="294" width="18" height="50" rx="9" fill="url(#tpu)"/>
    <rect x="1314" y="300" width="10" height="38" rx="5" fill="#9AA1AB"/>
    <circle cx="1264" cy="319" r="4" fill="#12A150"/>
    <text x="1220" y="324" fill="#1F2937" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700">05</text>
    <text x="1264" y="372" text-anchor="middle" fill="#6B7280" font-family="Microsoft YaHei, sans-serif" font-size="12">固定端 · 墙座</text>
  </g>

  <!-- lock state legend -->
  <g font-family="Microsoft YaHei, sans-serif">
    <rect x="70" y="470" width="340" height="68" rx="12" fill="#FFFFFF" stroke="#E1E5EA"/>
    <circle cx="94" cy="504" r="6" fill="#12A150"/>
    <text x="112" y="509" fill="#374151" font-size="14">绿点 = 锁紧（扳手扳下）</text>
    <circle cx="250" cy="504" r="6" fill="#D97706"/>
    <text x="268" y="509" fill="#374151" font-size="14">橙点 = 松开</text>
  </g>

  <!-- callouts -->
  <g font-family="Microsoft YaHei, sans-serif">
    <g><circle cx="440" cy="188" r="13" fill="#2F6FED"/><text x="440" y="193" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text>
      <text x="462" y="193" fill="#1F2937" font-size="15">白色哑光 PC/ABS 外壳</text>
      <text x="462" y="216" fill="#6B7280" font-size="13">不反光、不显指纹，像家电而不是数码产品</text></g>
    <g><circle cx="820" cy="188" r="13" fill="#2F6FED"/><text x="820" y="193" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text>
      <text x="842" y="193" fill="#1F2937" font-size="15">银色阳极氧化铝内管</text>
      <text x="842" y="216" fill="#6B7280" font-size="13">伸缩时露出，唯一"机械感"来源，不做金色</text></g>
    <g><circle cx="1100" cy="188" r="13" fill="#2F6FED"/><text x="1100" y="193" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">3</text>
      <text x="1122" y="193" fill="#1F2937" font-size="15">浅灰 TPU 接缝护圈</text>
      <text x="1122" y="216" fill="#6B7280" font-size="13">10mm 缝 + 圆角，衣架挂这里，防夹手</text></g>
  </g>

  <!-- footer -->
  <g font-family="Microsoft YaHei, sans-serif">
    <text x="70" y="590" fill="#1F2937" font-size="15" font-weight="700">产品语言</text>
    <text x="70" y="622" fill="#4B5563" font-size="15">主色：哑光白 #F2F2F0 / 浅灰 #D8DADD / 阳极氧化银；状态：绿 #12A150 / 橙 #D97706；强调（App）：蓝 #2F6FED</text>
    <text x="70" y="652" fill="#6B7280" font-size="14">端部 01/05 是固定端：墙座 + 橡胶垫 + 抱箍锁死；中间 02—04 可拖/可锁，两端各一个拇指扳手。</text>
    <text x="70" y="682" fill="#6B7280" font-size="14">无金色、无发光圆环、无外露螺丝；品牌字 5mm 激光蚀刻在底部。</text>
    <text x="70" y="724" fill="#9CA3AF" font-size="12">概念示意图：用于说明形态与 CMF，最终以 3D 建模/打样为准。</text>
  </g>
</svg>
