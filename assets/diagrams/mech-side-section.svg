<line class="lead" x1="510.0" y1="470.0" x2="650.0" y2="520.0"/>
<circle cx="510.0" cy="470.0" r="2.4" fill="#b45309"/>
<text class="lb" x="650.0" y="524.0" text-anchor="start">挂点钢销（杆轴正下方 48）</text>
<text class="sub" x="28.0" y="600.0" text-anchor="start">① 沿杆方向 10N 推挤 → 俯仰力矩 M = 10 × 0.048 = 0.48 N·m，由前后惰轮支反力差承担：</text>
<text class="sub" x="28.0" y="621.0" text-anchor="start">   ΔN = M / 60mm = ±4.0 N（单轮 12.5 ± 4.0 N），后轮仍 &gt;0 不抬离，SF 3.1。</text>
<text class="sub" x="28.0" y="642.0" text-anchor="start">② 速度：v = πDn/60 = π×0.028×30/60 = 44.0 mm/s；20cm 用时 4.55 s（设计值 5.0 s，含加减速与负载降速）。</text>
<text class="sub" x="28.0" y="663.0" text-anchor="start">③ 挂点销心 (y=0, z=−48)：2kg 衣物重力通过杆轴 → 对杆轴力矩 = 0（几何保证，不靠摩擦）。</text>
</svg>
