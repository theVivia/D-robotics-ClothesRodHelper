<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
<style>
  .out   { fill:none; stroke:#1f2937; stroke-width:1.8; stroke-linejoin:round; }
  .part  { fill:#f1f5f9; stroke:#1f2937; stroke-width:1.7; stroke-linejoin:round; }
  .p2    { fill:#e2e8f0; stroke:#1f2937; stroke-width:1.6; stroke-linejoin:round; }
  .dash  { fill:#ffffff; stroke:#64748b; stroke-width:1.2; stroke-dasharray:7 4; }
  .cut   { fill:url(#hatch); stroke:#1f2937; stroke-width:1.8; }
  .soft  { fill:#cbd5e1; stroke:#334155; stroke-width:1.4; }
  .dim   { fill:none; stroke:#0f766e; stroke-width:0.9; marker-start:url(#ar); marker-end:url(#ar); }
  .ext   { fill:none; stroke:#0f766e; stroke-width:0.7; stroke-dasharray:4 3; }
  .lead  { fill:none; stroke:#b45309; stroke-width:0.9; }
  .dt    { font:12px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#0f766e; text-anchor:middle;
           paint-order:stroke; stroke:#ffffff; stroke-width:3.5; stroke-linejoin:round; }
  .lb    { font:13px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#7c2d12; }
  .ttl   { font:bold 18px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#0f172a; }
  .sub   { font:12.5px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#475569; }
  .in    { font:12px 'Microsoft YaHei','PingFang SC',sans-serif; fill:#0f172a; text-anchor:middle;
           paint-order:stroke; stroke:#ffffff; stroke-width:3; }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,1 L10,5 L0,9 z" fill="#0f766e"/>
  </marker>
  <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="8" height="8" fill="#dbe3ec"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#8fa2b8" stroke-width="1.1"/>
  </pattern>
</defs>
<rect x="0" y="0" width="900" height="700" fill="#ffffff"/>
