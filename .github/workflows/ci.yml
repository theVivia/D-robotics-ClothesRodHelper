name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pytest opencv-python-headless

      - name: v2 simulation + figures + tests
        run: python sim-v2/run_all.py

      - name: Markdown relative links
        run: python assets/scripts/check_links.py
