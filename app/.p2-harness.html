<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>P2 harness</title>
<style>html,body{margin:0;background:#1a1d24;color:#dfe6f0;font:12px/1.5 monospace}iframe{width:390px;height:844px;border:0;display:block;background:#000}#result{white-space:pre-wrap;padding:12px;max-width:900px}</style>
</head>
<body>
<iframe id="frame"></iframe>
<pre id="result">running...</pre>
<script>
(async function () {
  var f = document.getElementById('frame');
  var errors = [];
  var out = { steps: [] };
  var d, w;
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function txt(el) { return el ? el.textContent.replace(/\s+/g, ' ').trim() : null; }
  function order() {
    return Array.prototype.slice.call(d.querySelectorAll('.unit')).sort(function (a, b) {
      return parseFloat(a.style.left) - parseFloat(b.style.left);
    }).map(function (u) { return txt(u.querySelector('.clip-no')); });
  }
  function snap(name) {
    var chans = Array.prototype.slice.call(d.querySelectorAll('.chan')).map(function (c) {
      return txt(c.querySelector('.chan-val'));
    });
    out.steps.push({
      name: name,
      order: order(),
      gaps: chans,
      ok: txt(d.getElementById('statOk')),
      badge: getComputedStyle(d.getElementById('p2Badge')).display,
      p2RowOn: d.getElementById('p2Row').classList.contains('on'),
      p2Note: txt(d.getElementById('p2Note')),
      logs: Array.prototype.slice.call(d.querySelectorAll('#log li')).slice(0, 5).map(txt),
      state: txt(d.getElementById('stateText')),
      scrollW: d.documentElement.scrollWidth,
      clientW: d.documentElement.clientWidth
    });
  }
  var html = await (await fetch('index.html')).text();
  var shim = '<scr' + 'ipt>' +
    'window.requestAnimationFrame=function(fn){return setTimeout(function(){fn(performance.now())},16)};' +
    'window.cancelAnimationFrame=function(id){clearTimeout(id)};' +
    '</scr' + 'ipt>';
  html = html.replace('<head>', '<head>' + shim);
  f.addEventListener('load', async function () {
    d = f.contentDocument;
    w = f.contentWindow;
    w.addEventListener('error', function (e) { errors.push('error: ' + e.message); });
    w.addEventListener('unhandledrejection', function (e) { errors.push('rejection: ' + e.reason); });
    var s = d.createElement('style');
    s.textContent = 'html{scrollbar-width:none}::-webkit-scrollbar{display:none}';
    d.head.appendChild(s);
    await sleep(400);

    out.initial = {
      innerWidth: w.innerWidth, clientW: d.documentElement.clientWidth, scrollW: d.documentElement.scrollWidth,
      mq640: w.matchMedia('(max-width:640px)').matches,
      overflow: Array.prototype.slice.call(d.querySelectorAll('body *')).map(function (el) {
        var r = el.getBoundingClientRect();
        return { el: el.tagName + '.' + (typeof el.className === 'string' ? el.className : ''), right: Math.round(r.right) };
      }).filter(function (o) { return o.right > d.documentElement.clientWidth + 1; }).slice(0, 10)
    };
    snap('initial');

    d.querySelector('.mode[data-mode="smart"]').click();
    await sleep(2400);
    snap('smart-default');

    d.getElementById('p2Toggle').click();
    await sleep(300);
    snap('p2-on');

    d.querySelector('.mode[data-mode="smart"]').click();
    await sleep(2800);
    snap('smart-p2');

    d.getElementById('p2Toggle').click();
    await sleep(300);
    d.querySelector('.mode[data-mode="smart"]').click();
    await sleep(2400);
    snap('smart-off');

    // 急停时不允许切换 P2
    d.getElementById('btnEstop').click();
    await sleep(150);
    d.getElementById('p2Toggle').click();
    await sleep(150);
    snap('estop-p2-blocked');

    out.errors = errors;
    document.getElementById('result').textContent = JSON.stringify(out, null, 1);
  }, { once: true });
  f.srcdoc = html;
})();
</script>
</body>
</html>
